<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2d5a87"/>
    </linearGradient>
    <linearGradient id="catalyst" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d6efd"/>
      <stop offset="100%" stop-color="#0a58ca"/>
    </linearGradient>
    <linearGradient id="appsail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#198754"/>
      <stop offset="100%" stop-color="#157347"/>
    </linearGradient>
    <linearGradient id="quickml" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6f42c1"/>
      <stop offset="100%" stop-color="#5a32a3"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fd7e14"/>
      <stop offset="100%" stop-color="#d96c0b"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#20c997"/>
      <stop offset="100%" stop-color="#17a87c"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0d6efd"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#f8f9fa" rx="12"/>

  <!-- Title -->
  <rect x="0" y="0" width="1200" height="60" fill="url(#header)" rx="12"/>
  <rect x="0" y="30" width="1200" height="30" fill="url(#header)"/>
  <text x="600" y="38" text-anchor="middle" fill="white" font-size="20" font-weight="700">Crime Genome Project — Architecture &amp; Product Flow</text>

  <!-- === LAYER 1: DATA INPUT === -->
  <rect x="30" y="80" width="1140" height="130" rx="8" fill="#e9ecef" opacity="0.5"/>
  <text x="45" y="100" fill="#666" font-size="11" font-weight="600" text-transform="uppercase">Layer 1: Data Ingestion</text>

  <!-- FIR Data Store -->
  <rect x="60" y="115" width="180" height="50" rx="8" fill="url(#catalyst)" filter="url(#shadow)"/>
  <text x="150" y="138" text-anchor="middle" fill="white" font-size="10" font-weight="600">📋 CCTNS/FIR Data Store</text>
  <text x="150" y="154" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">500K synthetic FIRs • 10 districts</text>

  <!-- Synthetic Data -->
  <rect x="280" y="115" width="160" height="50" rx="8" fill="#adb5bd" filter="url(#shadow)"/>
  <text x="360" y="138" text-anchor="middle" fill="white" font-size="10" font-weight="600">📦 Synthetic Data</text>
  <text x="360" y="154" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">26 CSV tables</text>

  <!-- Zia Voice -->
  <rect x="480" y="115" width="160" height="50" rx="8" fill="url(#catalyst)" filter="url(#shadow)"/>
  <text x="560" y="138" text-anchor="middle" fill="white" font-size="10" font-weight="600">🎤 Zia Voice Pipeline</text>
  <text x="560" y="154" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">STT → Translate → Query → TTS</text>

  <!-- User Input -->
  <rect x="680" y="115" width="160" height="50" rx="8" fill="#6c757d" filter="url(#shadow)"/>
  <text x="760" y="138" text-anchor="middle" fill="white" font-size="10" font-weight="600">👤 User Input</text>
  <text x="760" y="154" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">Voice • Text • Query</text>

  <!-- Arrow from input to functions -->
  <line x1="600" y1="165" x2="600" y2="230" stroke="#888" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,4"/>

  <!-- === LAYER 2: ORCHESTRATION === -->
  <rect x="30" y="230" width="1140" height="140" rx="8" fill="#e9ecef" opacity="0.5"/>
  <text x="45" y="250" fill="#666" font-size="11" font-weight="600">Layer 2: Orchestration &amp; Processing</text>

  <!-- Signals Event Bus -->
  <rect x="60" y="265" width="240" height="45" rx="8" fill="url(#signal)" filter="url(#shadow)"/>
  <text x="180" y="286" text-anchor="middle" fill="white" font-size="10" font-weight="600">⏱️ Signals / Job Scheduling</text>
  <text x="180" y="301" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">Event bus • Cron triggers</text>

  <!-- Catalyst Functions -->
  <rect x="340" y="265" width="520" height="45" rx="8" fill="url(#catalyst)" filter="url(#shadow)"/>
  <text x="600" y="283" text-anchor="middle" fill="white" font-size="10" font-weight="600">⚡ Catalyst Serverless Functions (Node.js, &lt;30s)</text>
  <text x="600" y="298" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">fir_api • zia_voice • legal_rag • quickml_predict • alert_job • veracity • topology • victim_risk</text>

  <!-- AppSail -->
  <rect x="900" y="265" width="240" height="45" rx="8" fill="url(#appsail)" filter="url(#shadow)"/>
  <text x="1020" y="286" text-anchor="middle" fill="white" font-size="10" font-weight="600">🐍 AppSail Docker (Python, &gt;30s)</text>
  <text x="1020" y="301" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">NetworkX graphs • Batch ML</text>

  <!-- Precomputation arrow -->
  <text x="600" y="328" text-anchor="middle" fill="#888" font-size="9" font-style="italic">Nightly batch: topology graphs • risk scores • beat optimization • model retraining</text>
  <line x1="600" y1="340" x2="600" y2="390" stroke="#888" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,4"/>

  <!-- === LAYER 3: ML & ANALYTICS === -->
  <rect x="30" y="390" width="1140" height="180" rx="8" fill="#e9ecef" opacity="0.5"/>
  <text x="45" y="410" fill="#666" font-size="11" font-weight="600">Layer 3: ML Models &amp; Analytics Engine</text>

  <!-- QuickML -->
  <rect x="60" y="425" width="200" height="60" rx="8" fill="url(#quickml)" filter="url(#shadow)"/>
  <text x="160" y="448" text-anchor="middle" fill="white" font-size="10" font-weight="600">🤖 QuickML (XGBoost)</text>
  <text x="160" y="463" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">Hotspot forecasting</text>
  <text x="160" y="476" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">Risk scoring</text>

  <!-- Veracity -->
  <rect x="300" y="425" width="200" height="60" rx="8" fill="url(#quickml)" filter="url(#shadow)"/>
  <text x="400" y="448" text-anchor="middle" fill="white" font-size="10" font-weight="600">🔍 FIR Veracity Index</text>
  <text x="400" y="463" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">VeriPol-style linguistic analysis</text>
  <text x="400" y="476" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">14 linguistic markers</text>

  <!-- Topology Navigator -->
  <rect x="540" y="425" width="200" height="60" rx="8" fill="url(#quickml)" filter="url(#shadow)"/>
  <text x="640" y="448" text-anchor="middle" fill="white" font-size="10" font-weight="600">🔗 Crime Topology Navigator</text>
  <text x="640" y="463" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">Markov transition matrix</text>
  <text x="640" y="476" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">FSC metric • Directed graph</text>

  <!-- Victim Risk -->
  <rect x="780" y="425" width="200" height="60" rx="8" fill="url(#quickml)" filter="url(#shadow)"/>
  <text x="880" y="448" text-anchor="middle" fill="white" font-size="10" font-weight="600">🛡️ Victim Risk Shield</text>
  <text x="880" y="463" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">Repeat victimization scoring</text>
  <text x="880" y="476" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">Pro-active outreach alerts</text>

  <!-- Connected line from orchestration to ML -->
  <line x1="280" y1="430" x2="280" y2="485" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="480" y1="430" x2="480" y2="485" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="680" y1="430" x2="680" y2="485" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="880" y1="430" x2="880" y2="485" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- GBV & Beat Opt labels below -->
  <rect x="60" y="505" width="240" height="50" rx="8" fill="url(#quickml)" filter="url(#shadow)"/>
  <text x="180" y="525" text-anchor="middle" fill="white" font-size="10" font-weight="600">📊 GBV Analytics Hub</text>
  <text x="180" y="541" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">FIR-to-conviction funnel • OSC integration</text>

  <rect x="340" y="505" width="240" height="50" rx="8" fill="url(#appsail)" filter="url(#shadow)"/>
  <text x="460" y="525" text-anchor="middle" fill="white" font-size="10" font-weight="600">🗺️ Beat &amp; Patrol Optimizer</text>
  <text x="460" y="541" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">MIP beat redesign • ACO routing</text>

  <rect x="620" y="505" width="240" height="50" rx="8" fill="url(#appsail)" filter="url(#shadow)"/>
  <text x="740" y="525" text-anchor="middle" fill="white" font-size="10" font-weight="600">🔬 Network Analysis</text>
  <text x="740" y="541" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">Louvain communities • Criminal links</text>

  <line x1="600" y1="570" x2="600" y2="620" stroke="#888" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,4"/>

  <!-- === LAYER 4: API & DASHBOARD === -->
  <rect x="30" y="620" width="1140" height="120" rx="8" fill="#e9ecef" opacity="0.5"/>
  <text x="45" y="640" fill="#666" font-size="11" font-weight="600">Layer 4: API &amp; Frontend</text>

  <!-- Slate Hosting -->
  <rect x="60" y="655" width="320" height="50" rx="8" fill="url(#slate)" filter="url(#shadow)"/>
  <text x="220" y="678" text-anchor="middle" fill="white" font-size="10" font-weight="600">🌐 Slate Hosting (React SPA)</text>
  <text x="220" y="694" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">HashRouter • Leaflet maps • ApexCharts • ForceGraph2D</text>

  <!-- API Gateway -->
  <rect x="420" y="655" width="320" height="50" rx="8" fill="url(#catalyst)" filter="url(#shadow)"/>
  <text x="580" y="678" text-anchor="middle" fill="white" font-size="10" font-weight="600">🔌 Catalyst API Gateway</text>
  <text x="580" y="694" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">8 Function endpoints • CORS • Auth</text>

  <!-- Auth -->
  <rect x="780" y="655" width="240" height="50" rx="8" fill="#dc3545" filter="url(#shadow)"/>
  <text x="900" y="678" text-anchor="middle" fill="white" font-size="10" font-weight="600">🔐 Catalyst Auth</text>
  <text x="900" y="694" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">Role-based: Inspector • Sub-Inspector</text>

  <line x1="600" y1="740" x2="600" y2="780" stroke="#888" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,4"/>

  <!-- === LAYER 5: USERS === -->
  <profile>
    <rect x="30" y="790" width="1140" height="90" rx="8" fill="#e9ecef" opacity="0.5"/>
    <text x="45" y="810" fill="#666" font-size="11" font-weight="600">Layer 5: Users</text>
  </profile>

  <!-- User types -->
  <rect x="80" y="820" width="200" height="45" rx="20" fill="#0d6efd" filter="url(#shadow)"/>
  <text x="180" y="845" text-anchor="middle" fill="white" font-size="11" font-weight="600">👮 Analyst / Inspector</text>

  <rect x="340" y="820" width="200" height="45" rx="20" fill="#198754" filter="url(#shadow)"/>
  <text x="440" y="845" text-anchor="middle" fill="white" font-size="11" font-weight="600">🚔 Patrol Officer</text>

  <rect x="600" y="820" width="200" height="45" rx="20" fill="#6f42c1" filter="url(#shadow)"/>
  <text x="700" y="845" text-anchor="middle" fill="white" font-size="11" font-weight="600">🛡️ Victim Support</text>

  <rect x="860" y="820" width="200" height="45" rx="20" fill="#fd7e14" filter="url(#shadow)"/>
  <text x="960" y="845" text-anchor="middle" fill="white" font-size="11" font-weight="600">📊 Senior Leadership</text>

  <!-- Data flow arrows from layers -->
  <line x1="220" y1="805" x2="220" y2="820" stroke="#0d6efd" stroke-width="2"/>
  <line x1="440" y1="805" x2="440" y2="820" stroke="#198754" stroke-width="2"/>
  <line x1="700" y1="805" x2="700" y2="820" stroke="#6f42c1" stroke-width="2"/>
  <line x1="960" y1="805" x2="960" y2="820" stroke="#fd7e14" stroke-width="2"/>

  <!-- Legend -->
  <rect x="30" y="870" width="1140" height="20" rx="4" fill="transparent"/>
  <rect x="50" y="875" width="12" height="12" rx="2" fill="#0d6efd"/>
  <text x="66" y="886" fill="#666" font-size="8">Catalyst Service</text>
  <rect x="150" y="875" width="12" height="12" rx="2" fill="#198754"/>
  <text x="166" y="886" fill="#666" font-size="8">AppSail Docker</text>
  <rect x="260" y="875" width="12" height="12" rx="2" fill="#6f42c1"/>
  <text x="276" y="886" fill="#666" font-size="8">QuickML Model</text>
  <rect x="370" y="875" width="12" height="12" rx="2" fill="#fd7e14"/>
  <text x="386" y="886" fill="#666" font-size="8">Signals Event Bus</text>
  <rect x="480" y="875" width="12" height="12" rx="2" fill="#20c997"/>
  <text x="496" y="886" fill="#666" font-size="8">Slate Hosting</text>
  <text x="600" y="886" fill="#999" font-size="8">Platform: Zoho Catalyst | Region: India (IN) | Built: KSP Datathon 2026</text>
</svg>
